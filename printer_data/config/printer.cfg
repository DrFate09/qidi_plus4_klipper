[gcode_macro _TOGGLE_CASELIGHT]
gcode:
  SET_PIN PIN=caselight VALUE={(not printer['output_pin caselight'].value)|int}

# ======================================================================
# INCLUDES
# ======================================================================
[include plugins/*.cfg]
[include moonraker_obico_macros.cfg]
[include timelapse.cfg]
[include KAMP_Settings.cfg]
[include macros/*.cfg]
[include gcode_macros.cfg]
[include mmu/optional/client_macros.cfg]
[include bunnybox_macros.cfg] 
[include mmu/base/*.cfg]
# [include mmu/*.cfg]
# [include mmu/addons/*.cfg]
# [include mmu/optional/*.cfg]

# ======================================================================
# CORE PRINTER & MCU SETUP
# ======================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1F0034000950324257333720-if00
restart_method: command
#baud: 500000

[mcu toolhead]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
restart_method: command
baud: 500000

[mcu host]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[display_status]

[print_stats]

[respond]

[exclude_object]

[duplicate_pin_override]
pins:
    
[gcode_arcs]
resolution: 0.5

[idle_timeout]
timeout: 43200
gcode:
    {% if printer.mmu is defined and printer.mmu.drying_state[0] == 'active' %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    {% else %}
      TURN_OFF_HEATERS
      M84
    {% endif %}

# ======================================================================
# MOTOR CONSTANTS
# ======================================================================
[motor_constants qidi_xy_motors]
resistance: 1.4
inductance: 0.0026
holding_torque: 0.41
max_current: 1.5
steps_per_revolution: 200

[motor_constants qidi_z_motors]
resistance: 2.0
inductance: 0.0034
holding_torque: 0.28
max_current: 1.5
steps_per_revolution: 200

[motor_constants qidi_extruder_motors]
resistance: 2.0
inductance: 0.0013
holding_torque: 0.1
max_current: 1.0
steps_per_revolution: 200

# ======================================================================
# STEPPERS & AUTOTUNE
# ======================================================================
[stepper_x]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB5
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200 # set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: -1.5
position_endstop: -1.5
position_max: 307
homing_speed: 50
homing_retract_dist: 20
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_x]
cs_pin: PD2
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_speed: 200000
run_current: 1.07
home_current: 0.59
## home_current: 0.74
interpolate: true
stealthchop_threshold: 0
diag0_pin: !PB8
driver_SGT: 1
rref: 12000

[autotune_tmc stepper_x]
motor: qidi_xy_motors
tuning_goal: performance

[stepper_y]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PC15
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -3
position_endstop: -3
position_max: 325
homing_speed: 50
homing_retract_dist: 20
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_y]
cs_pin: PB9
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_speed: 200000
run_current: 1.07
home_current: 0.48
## home_current: 0.74
interpolate: true
stealthchop_threshold: 0
diag0_pin: !PC0
driver_SGT: 1
rref: 12000

[autotune_tmc stepper_y]
motor: qidi_xy_motors
tuning_goal: performance

[stepper_z]
step_pin: PB1
dir_pin: PB6
enable_pin:!PB0
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 287
position_min: -4
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_z]
uart_pin: PB7
run_current: 1.07
interpolate: false
stealthchop_threshold: 999999
diag_pin: ^PA13
driver_SGTHRS: 100
sense_resistor: 0.11

[autotune_tmc stepper_z]
motor: qidi_z_motors
tuning_goal: silent

[stepper_z1]
step_pin: PC10
dir_pin: PA15
enable_pin: !PC11
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PC5
run_current: 1.07
interpolate: false
stealthchop_threshold: 999999
diag_pin: ^PC12
driver_SGTHRS: 100
sense_resistor: 0.11

[autotune_tmc stepper_z1]
motor: qidi_z_motors
tuning_goal: silent

# ======================================================================
# EXTRUDER & RETRACTION
# ======================================================================
[extruder]
step_pin: toolhead:PB9
dir_pin: toolhead:PB8
enable_pin: !toolhead:PC15
rotation_distance: 53.7
gear_ratio: 1517:170
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.500
min_temp: 0
max_temp: 370
min_extrude_temp: 175
smooth_time: 0.000001
heater_pin: toolhead:PB3
sensor_type: MAX6675
sensor_pin: toolhead:PB12
spi_speed: 100000
spi_software_sclk_pin: toolhead:PB13
spi_software_mosi_pin: toolhead:PA11
spi_software_miso_pin: toolhead:PB14
max_power: 1 

pressure_advance: 0.032
pressure_advance_smooth_time: 0.03
max_extrude_cross_section: 500
instantaneous_corner_velocity: 10
max_extrude_only_distance: 1000
max_extrude_only_velocity: 5000
max_extrude_only_accel: 5000
step_pulse_duration: 0.000002

#control: mpc
heater_power: 86 
cooling_fan: fan_generic cooling_fan
ambient_temp_sensor: temperature_sensor beacon_coil
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.80 

[tmc2209 extruder]
uart_pin: toolhead:PC13
interpolate: false
run_current: 0.714
stealthchop_threshold: 0
sense_resistor: 0.11

[autotune_tmc extruder]
motor: qidi_extruder_motors
tuning_goal: performance

[firmware_retraction]
retract_length: 0.8
retract_speed: 50
unretract_extra_length: 0
unretract_speed: 50

# ======================================================================
# HEATERS & TEMPERATURE SENSORS
# ======================================================================
[heater_bed]
heater_pin: PB10
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA0
max_power: 1.0
pwm_cycle_time: 0.001
min_temp: 0
max_temp: 125

[verify_heater heater_bed]
max_error: 200
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[heater_generic chamber]
heater_pin: PC8
max_power: 0.4
sensor_type: temperature_combined
sensor_list: temperature_sensor toolhead_mcu, temperature_sensor chamber_probe
combination_method: mean
maximum_deviation: 70

pwm_cycle_time:0.02088            # Reduced to 0.02088 seconds to reduce flicker (within 0.3 limit)
control = pid
pid_Kp=45
pid_Ki=0.1
pid_Kd=5000
#pid_Kp=63.418 
#pid_Ki=1.342 
#pid_Kd=749.125
min_temp: -100
max_temp: 80

[verify_heater chamber]
max_error: 400
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 1

[temperature_sensor chamber_probe]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA1

[temperature_sensor chamber_thermal_protection_sensor]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC2
min_temp: -100
max_temp: 140

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

# ======================================================================
# FANS
# ======================================================================
[fan_generic cooling_fan]
pin: toolhead:PA8
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
tachometer_pin: toolhead:PA9
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[fan_generic auxiliary_cooling_fan]
pin: PA8
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100

[fan_generic exhaust_fan]
pin: PC9
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100

[heater_fan hotend_fan]
pin: toolhead:PB5
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
tachometer_pin: ^toolhead:PA10

[heater_fan chamber_fan]
pin: PA4
max_power: 1.0
kick_start_time: 0.5
heater: chamber
fan_speed: 1.0

[controller_fan board_fan]
pin: PC4
max_power: 1.0
fan_speed: 1
kick_start_time: 0
stepper: stepper_x

# ======================================================================
# BED LEVELING & MESH
# ======================================================================
[bed_mesh]
speed: 300
horizontal_move_z: 2
zero_reference_position: 152.5, 152.5
mesh_min: 30, 30
mesh_max: 270, 270
probe_count: 14, 14
algorithm: bicubic
bicubic_tension: 0.3
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
split_delta_z: 0.01
move_check_distance: 4

[bed_screws]
screw1: 21, 24
screw1_name: Front left
screw2: 278, 24
screw2_name: Front right
screw3: 278, 283
screw3_name: Back right
screw4: 21, 283
screw4_name: Back left
speed: 150

[screws_tilt_adjust]
screw1: 21, 24
screw1_name: Front left
screw2: 278, 24
screw2_name: Front right
screw3: 278, 283
screw3_name: Back right
screw4: 21, 283
screw4_name: Back left
horizontal_move_z: 10
screw_thread: CW-M4
speed: 150

[z_tilt]
z_positions:
    -17.5,152.5
    335.7,152.5
points:
    40, 171.3           # Assumes we are using the stew675 beacon mount offsets of X=0, Y=-18.8
    265, 171.3          # Assumes we are using the stew675 beacon mount offsets of X=0, Y=-18.8
speed: 200
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.006

# ======================================================================
# MISCELLANEOUS & DISABLED CONFIGS
# ======================================================================
[soak_my_bed]

[output_pin caselight]
pin: PC7
pwm: false
shutdown_value: 1
value: 1

[output_pin buzzer]
pin: PA2
pwm: false
shutdown_value: 0
value: 0

