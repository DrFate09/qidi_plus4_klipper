#######################################
# Plugins, Includes & Basic Setup
#######################################
[include bunnybox_macros.cfg]
# [include mmu/*.cfg]
# [include mmu/addons/*.cfg]
# [include mmu/base/*.cfg]
# [include mmu/optional/*.cfg]

#[include mmu/*.cfg]
#[include mmu/addons/*.cfg]
[include mmu/base/*.cfg]
#[include mmu/optional/*.cfg]

[include plugins/*.cfg]

[include moonraker_obico_macros.cfg]

[include timelapse.cfg]

[include KAMP_Settings.cfg]

[include macros/*.cfg]

[include gcode_macros.cfg]

#[include camera_ctrl.cfg]
    
[print_stats]

[duplicate_pin_override]
pins:
    
[gcode_arcs]
resolution: 0.5

[exclude_object]

[respond]

[save_variables]
filename: ~/printer_data/config/variables.cfg

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[display_status]

[idle_timeout]
timeout: 1800

[firmware_retraction]
retract_length: 0.8
retract_speed: 50
unretract_extra_length: 0
unretract_speed: 50

#######################################
# Klipper TMC Autotune
#######################################
[motor_constants qidi_xy_motors]
resistance: 1.4
inductance: 0.0026
holding_torque: 0.41
max_current: 1.5
steps_per_revolution: 200

[motor_constants qidi_z_motors]
resistance: 2.0
inductance: 0.0034
holding_torque: 0.28
max_current: 1.5
steps_per_revolution: 200

[motor_constants qidi_extruder_motors]
resistance: 2.0
inductance: 0.0013
holding_torque: 0.1
max_current: 1.0
steps_per_revolution: 200

#######################################
# MCU Definitions
#######################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1F0034000950324257333720-if00
restart_method: command
#baud: 500000

[mcu toolhead]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
restart_method: command
baud: 500000

[mcu host]
serial: /tmp/klipper_host_mcu

#######################################
# Basic Printer Kinematics
#######################################
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#######################################
# Bed Screws
#######################################
[bed_screws]
screw1: 21, 24
screw1_name: Front left
screw2: 278, 24
screw2_name: Front right
screw3: 278, 283
screw3_name: Back right
screw4: 21, 283
screw4_name: Back left
speed: 150

[screws_tilt_adjust]
screw1: 21, 24
screw1_name: Front left
screw2: 278, 24
screw2_name: Front right
screw3: 278, 283
screw3_name: Back right
screw4: 21, 283
screw4_name: Back left
screw_thread: CW-M4
speed: 150

