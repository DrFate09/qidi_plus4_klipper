#######################################
# Filament Sensors
#######################################
[filament_switch_sensor filament]
switch_pin: PC3
pause_on_runout: true
runout_gcode:
    M118 Filament tangle detected
event_delay: 3.0
pause_delay: 0.5

[filament_switch_sensor toolhead]
switch_pin: ^!toolhead:PA3
#switch_pin: ^toolhead:PA3
pause_on_runout: true
runout_gcode:
    PAUSE
    M118 Filament run out 

