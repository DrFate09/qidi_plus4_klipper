#######################################
# Stepper Configs for XYZ
#######################################
[stepper_x]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB5
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200 # set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: -1.5
position_endstop: -1.5
position_max: 307
homing_speed: 50
homing_retract_dist: 20
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_x]
cs_pin: PD2
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_speed: 200000
run_current: 1.15
home_current: 0.74
interpolate: true
stealthchop_threshold: 0
diag0_pin: !PB8
driver_SGT: 1
rref: 12000

[autotune_tmc stepper_x]
motor: qidi_xy_motors
tuning_goal: performance

[stepper_y]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PC15
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -3
position_endstop: -3
position_max: 325
homing_speed: 50
homing_retract_dist: 20
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_y]
cs_pin: PB9
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_speed: 200000
run_current: 1.15
home_current: 0.74
interpolate: true
stealthchop_threshold: 0
diag0_pin: !PC0
driver_SGT: 1
rref: 12000

[autotune_tmc stepper_y]
motor: qidi_xy_motors
tuning_goal: performance

[stepper_z]
step_pin: PB1
dir_pin: PB6
enable_pin:!PB0
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 287
position_min: -4
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_z]
uart_pin: PB7
run_current: 1.15
interpolate: false
stealthchop_threshold: 999999
diag_pin: ^PA13
driver_SGTHRS: 100
sense_resistor: 0.11

[autotune_tmc stepper_z]
motor: qidi_z_motors
tuning_goal: silent

[stepper_z1]
step_pin: PC10
dir_pin: PA15
enable_pin: !PC11
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PC5
run_current: 1.15
interpolate: false
stealthchop_threshold: 999999
diag_pin: ^PC12
driver_SGTHRS: 100
sense_resistor: 0.11

[autotune_tmc stepper_z1]
motor: qidi_z_motors
tuning_goal: silent

#######################################
# Heaters
#######################################
[heater_bed]
heater_pin: PB10
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA0
max_power: 1.0
pwm_cycle_time: 0.001
min_temp: 0
max_temp: 125

[heater_generic chamber]
heater_pin: PC8
max_power: 0.4
sensor_type: temperature_combined
sensor_list: temperature_sensor toolhead_mcu, temperature_sensor chamber_probe
combination_method: mean
maximum_deviation: 70

pwm_cycle_time:0.02088            # Reduced to 0.02088 seconds to reduce flicker (within 0.3 limit)
control = pid
pid_Kp=45
pid_Ki=0.1
pid_Kd=5000
#pid_Kp=63.418 
#pid_Ki=1.342 
#pid_Kd=749.125
min_temp: -100
max_temp: 80

[temperature_sensor chamber_probe]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA1

[verify_heater chamber]
max_error: 400
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[temperature_sensor chamber_thermal_protection_sensor]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC2
min_temp: -100
max_temp: 140

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 1

[verify_heater heater_bed]
max_error: 200
check_gain_time: 60
hysteresis: 10
heating_gain: 1

#######################################
# Fans
#######################################
[fan_generic cooling_fan]
pin: toolhead:PA8
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
tachometer_pin: toolhead:PA9
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[fan_generic auxiliary_cooling_fan]
pin: PA8
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100

[fan_generic exhaust_fan]
pin: PC9
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100

[heater_fan hotend_fan]
pin: toolhead:PB5
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
tachometer_pin: ^toolhead:PA10

[heater_fan chamber_fan]
pin: PA4
max_power: 1.0
kick_start_time: 0.5
heater: chamber
fan_speed: 1.0

[controller_fan board_fan]
pin: PC4
max_power: 1.0
fan_speed: 1
kick_start_time: 0
stepper: stepper_x

