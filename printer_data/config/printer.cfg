
#######################################
# Plugins, Includes & Basic Setup
#######################################
#[include plr.cfg]
#[include macros/*.cfg]
#[include time_update.cfg]

[include plugins/*.cfg]

[include fluidd.cfg]

[include gcode_macros.cfg]

[include moonraker_obico_macros.cfg]

[include fan_tach_monitor.cfg]

[include timelapse.cfg]

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode:CANCEL_PRINT
    
[print_stats]

[respond]
default_type: echo

#[save_variables] 
#filename = /home/derek/printer_data/config/saved_variables.cfg

[duplicate_pin_override]
pins:
    
[gcode_arcs]
resolution: 0.5

[exclude_object]

#######################################
# Klipper TMC Autotune
#######################################
[motor_constants qidi_xy_motors]
resistance: 1.4
inductance: 0.0026
holding_torque: 0.41
max_current: 1.5
steps_per_revolution: 200

[motor_constants qidi_z_motors]
resistance: 2.0
inductance: 0.0034
holding_torque: 0.28
max_current: 1.5
steps_per_revolution: 200

[motor_constants qidi_extruder_motors]
resistance: 2.0
inductance: 0.0013
holding_torque: 0.1
max_current: 1.0
steps_per_revolution: 200

#######################################
# MCU Definitions
#######################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_1F0034000950324257333720-if00
restart_method: command
baud: 500000

[mcu toolhead]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
restart_method: command
baud: 500000

[mcu host]
serial: /tmp/klipper_host_mcu

#######################################
# Basic Printer Kinematics
#######################################
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5

[temperature_sensor QIDI_MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor Toolhead_MCU]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#######################################
# Bed Screws
#######################################
[bed_screws]
screw1: 25,21
screw1_name: Front left
screw2: 285,21
screw2_name: Front right
screw3: 285,281
screw3_name: Back right
screw4: 25,281

[screws_tilt_adjust]
screw1: 25,56.5
screw1_name: Front left
screw2: 285,56.5
screw2_name: Front right
screw3: 285,305.5
screw3_name: Back right
screw4: 25,305.5
screw4_name: Back left
screw_thread: CW-M4

#######################################
#   Bed Mesh
#######################################
[bed_mesh]
speed: 250
horizontal_move_z: 2
#mesh_min: 40,15
#mesh_max: 260,283
mesh_min: 15,35
mesh_max: 283,263
probe_count: 15,15
algorithm: bicubic
bicubic_tension: 0.3
mesh_pps: 2,2
zero_reference_position: 152,152
split_delta_z: 0.015

#######################################
#   Z Tilt and Screws
#######################################
[z_tilt]
adaptive_horizontal_move_z: true
z_positions:
    -17.5,152
    335.7,152    
points:
    50, 150.8
    255, 150.8
    #10,150
    #290,150    
speed: 200
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.005

#######################################
# Extruder Settings
#######################################
[extruder]
step_pin: toolhead:PB9
dir_pin: toolhead:PB8
enable_pin: !toolhead:PC15
rotation_distance: 53.7  #22.6789511 Bondtech 5mm Drive Gears
gear_ratio: 1517:170
microsteps: 16
full_steps_per_rotation: 200 #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 380
min_extrude_temp: 175
smooth_time: 0.000001
heater_pin: toolhead: PB3
sensor_type: MAX6675
sensor_pin: toolhead:PB12
spi_speed: 100000
spi_software_sclk_pin: toolhead:PB13
spi_software_mosi_pin: toolhead:PA11
spi_software_miso_pin: toolhead:PB14
max_power: 1
heater_power: 80  

pressure_advance: 0.027
pressure_advance_smooth_time: 0.03
max_extrude_cross_section: 500
instantaneous_corner_velocity: 10.000
max_extrude_only_distance: 1000.0
max_extrude_only_velocity: 5000
max_extrude_only_accel: 5000
step_pulse_duration: 0.000002

[tmc2209 extruder]
uart_pin: toolhead:PC13
interpolate: false
run_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.11

[autotune_tmc extruder]
motor: qidi_extruder_motors
tuning_goal: performance

#######################################
# Resonance Testing
#######################################
[adxl345]
cs_pin: toolhead:PA4
spi_software_sclk_pin: toolhead:PA5
spi_software_mosi_pin: toolhead:PA7
spi_software_miso_pin: toolhead:PA6
axes_map: -x, z, -y

# [resonance_tester]
# accel_chip: adxl345
# probe_points:
#    150, 150, 10

#[resonance_tester]
#accel_chip: beacon
#probe_points: 150, 168.8, 25
#accel_axes_map: -x, z, -y

[resonance_tester]
accel_per_hz: 150
max_smoothing: 0.5

#[input_shaper]
#enabled_extruders: extruder

#######################################
# Stepper Configs for XYZ
#######################################
[stepper_x]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB5
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200 # set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: -1.5
position_endstop: -1.5
position_max: 307
homing_speed: 50
homing_retract_dist: 20
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_x]
cs_pin: PD2
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_speed: 200000
run_current: 1.15
home_current: 0.74
interpolate: true
stealthchop_threshold: 0
diag0_pin: !PB8
driver_SGT: 1
rref: 12000 # stock klipper value

[autotune_tmc stepper_x]
motor: qidi_xy_motors
tuning_goal: performance

[stepper_y]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PC15
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200 # set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -3
position_endstop: -3
position_max: 325
homing_speed: 50
homing_retract_dist: 20
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_y]
cs_pin: PB9
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_speed: 200000
run_current: 1.15
home_current: 0.74
interpolate: true
stealthchop_threshold: 0
diag0_pin: !PC0
driver_SGT: 1
rref: 12000 # stock Klipper value

[autotune_tmc stepper_y]
motor: qidi_xy_motors
tuning_goal: performance

[stepper_z]
step_pin: PB1
dir_pin: PB6
enable_pin:!PB0
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 287
position_min: -4
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 0 #beacon
homing_positive_dir: false

[tmc2209 stepper_z]
uart_pin: PB7
run_current: 1.15
interpolate: false
stealthchop_threshold: 999999
diag_pin: ^PA13
driver_SGTHRS: 100
sense_resistor: 0.11

[autotune_tmc stepper_z]
motor: qidi_z_motors
tuning_goal: performance

[stepper_z1]
step_pin: PC10
dir_pin: PA15
enable_pin: !PC11
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PC5
run_current: 1.15
interpolate: false
stealthchop_threshold: 999999
diag_pin: ^PC12
driver_SGTHRS: 100
sense_resistor: 0.11

[autotune_tmc stepper_z1]
motor: qidi_z_motors
tuning_goal: performance

