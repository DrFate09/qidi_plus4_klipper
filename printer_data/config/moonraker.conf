# ======================================================================
# CORE MOONRAKER SETTINGS
# ======================================================================

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/pi/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    192.168.0.0/16
    10.0.0.0/8
    127.0.0.0/8
    169.254.0.0/16
    172.16.0.0/12
    FC00::/7
    FE80::/10
    ::1/128
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz
    
[octoprint_compat]

[history]

[file_manager]
enable_object_processing: true

[announcements]
subscriptions:
    octoapp.

# ======================================================================
# HARDWARE, POWER, & WEBCAMS
# ======================================================================

[power Ventilation Fan]
type: homeassistant
protocol: http
address: 192.168.86.62
port: 8123
device: fan.cloudline_exhaust_fan
domain: fan
token: {secrets.home_assistant.token}

[webcam Creality Nebula]
service: webrtc-go2rtc
target_fps: 30 # 15 by default
stream_url: http://192.168.86.64:1984/stream.html?src=webcam
snapshot_url: http://192.168.86.64:1984/api/frame.jpeg?src=webcam
flip_horizontal: False
flip_vertical: False
rotation: 0 # May be 0, 90, 180, or 270. The default is 0.
aspect_ratio: 16:9 # Delete for 4:3 cameras
# Configuration UI: http://192.168.86.64:1984/
# Documentation: https://guides.jeikobu.net/go2rtc/

# ======================================================================
# PLUGINS & SERVICES
# ======================================================================

[mmu_server]
enable_file_preprocessor: True
enable_toolchange_next_pos: True
update_spoolman_location: True

[spoolman]
server: http://192.168.86.139:7913
sync_rate: 5

[timelapse]
output_path: ~/timelapse/
frame_path: /tmp/timelapse/
ffmpeg_binary_path: /usr/bin/ffmpeg

[analysis]
platform: auto
estimator_config:
auto_dump_default_config: false
estimator_timeout: 600
enable_auto_analysis: false
enable_estimator_updates: false

# [filaman]
# server: http://192.168.86.139:8000
# # api_key: uak.123.xxxxxxxxxxxxxxxxxxxxx
# sync_rate: 5
# default_density_g_cm3: 1.24
# default_diameter_mm: 1.75

# ======================================================================
# INCLUDES
# ======================================================================

[include octoapp-system.cfg]
[include moonraker-obico-update.cfg]

# ======================================================================
# UPDATE MANAGERS (Alphabetical)
# ======================================================================

[update_manager]
channel: dev
refresh_interval: 168

[update_manager beacon]
type: git_repo
channel: dev
path: ~/beacon_klipper
origin: https://github.com/beacon3d/beacon_klipper.git
env: ~/klippy-env/bin/python
requirements: requirements.txt
install_script: install.sh
is_system_service: False
managed_services: klipper
info_tags:
    desc=Beacon Surface Scanner

[update_manager fluidd]
path: /home/pi/fluidd
repo: fluidd-core/fluidd
channel: stable
type: web
persistent_files:
    config.json
    
[update_manager fluidd-config]
managed_services: klipper
origin: https://github.com/fluidd-core/fluidd-config.git
path: /home/pi/fluidd-config
primary_branch: master
type: git_repo

[update_manager go2rtc]
type: zip
repo: shindouj/go2moon
path: ~/go2rtc
managed_services: go2rtc

[update_manager happy-hare]
type: git_repo
path: ~/Happy-Hare
origin: https://github.com/moggieuk/Happy-Hare.git
primary_branch: main
managed_services: klipper

[update_manager klipper]
report_anomalies: False

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[update_manager klipperfleet]
type: git_repo
path: /home/pi/KlipperFleet
origin: https://github.com/JohnBaumb/KlipperFleet.git
primary_branch: main
managed_services: klipperfleet
virtualenv: /home/pi/KlipperFleet/venv
requirements: backend/requirements.txt
system_dependencies: install_scripts/system-dependencies.json
is_system_service: False

[update_manager klipper-motd]
type: git_repo
primary_branch: main
origin: https://www.github.com/tomaski/klipper-motd.git
path: ~/klipper-motd
is_system_service: False

[update_manager klipper_tmc_autotune]
type: git_repo
channel: dev
path: ~/klipper_tmc_autotune
origin: https://github.com/andrewmcgr/klipper_tmc_autotune.git
managed_services: klipper
primary_branch: main
install_script: install.sh

[update_manager Klippain-ShakeTune]
type: git_repo
origin: https://github.com/Frix-x/klippain-shaketune.git
path: ~/klippain_shaketune
virtualenv: /home/pi/klippy-env
requirements: requirements.txt
system_dependencies: system-dependencies.json
primary_branch: main
managed_services: klipper

[update_manager Klipper-Adaptive-Meshing-Purging]
type: git_repo
channel: dev
path: ~/Klipper-Adaptive-Meshing-Purging
origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
managed_services: klipper
primary_branch: main

[update_manager KlipperMaintenance]
type: git_repo
path: ~/KlipperMaintenance
origin: https://github.com/3DCoded/KlipperMaintenance.git
primary_branch: main
is_system_service: False
install_script: install.sh

[update_manager KlipperScreen]
install_script: /home/pi/KlipperScreen/scripts/KlipperScreen-install.sh
requirements: /home/pi/KlipperScreen/scripts/KlipperScreen-requirements.txt
env: /home/pi/.KlipperScreen-env/bin/python
managed_services: KlipperScreen
origin: https://github.com/moggieuk/KlipperScreen-Happy-Hare-Edition.git
path: /home/pi/KlipperScreen
type: git_repo

[update_manager mainsail]
path: /home/pi/mainsail
repo: mainsail-crew/mainsail
channel: stable
type: web
persistent_files:
    config.json

[update_manager mobileraker]
install_script: /home/pi/mobileraker_companion/scripts/install.sh
requirements: /home/pi/mobileraker_companion/scripts/mobileraker-requirements.txt
env: /home/pi/mobileraker-env/bin/python
managed_services: mobileraker
primary_branch: main
origin: https://github.com/Clon1998/mobileraker_companion.git
path: /home/pi/mobileraker_companion
type: git_repo

[update_manager moonraker]
report_anomalies: False

[update_manager moonraker-obico]
type: git_repo
path: ~/moonraker-obico
origin: https://github.com/TheSpaghettiDetective/moonraker-obico.git
env: ~/moonraker-obico-env/bin/python
requirements: requirements.txt
install_script: install.sh
managed_services:
    moonraker-obico

[update_manager octoapp]
type: git_repo
channel: beta
primary_branch: release
path: /home/pi/octoapp
origin: https://github.com/crysxd/OctoApp-Plugin.git
env: /home/pi/octoapp-env/bin/python
requirements: requirements.txt
install_script: install.sh
managed_services:
    octoapp
    
[update_manager soak-my-bed]
type: git_repo
path: ~/soak-my-bed
origin: https://github.com/marcofailli/soak-my-bed.git
primary_branch: main
install_script: install.sh
managed_services: klipper

[update_manager sonar]
type: git_repo
path: ~/sonar
origin: https://github.com/mainsail-crew/sonar.git
primary_branch: main
managed_services: sonar
system_dependencies: resources/system-dependencies.json

[update_manager timelapse]
type: git_repo
primary_branch: main
path: ~/moonraker-timelapse
origin: https://github.com/mainsail-crew/moonraker-timelapse.git
managed_services: klipper moonraker

[update_manager update_klipper_and_mcus]
type: git_repo
primary_branch: main
path: ~/ukam
origin: https://github.com/fbeauKmi/update_klipper_and_mcus.git
is_system_service: False