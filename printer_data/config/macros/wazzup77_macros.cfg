[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro MOVE_TO_TRASH]
gcode:
    _CG28
    M204 S10000
    {% if (printer.gcode_move.position.y) > 305 %}
        G1 X82 Y324 F6000
        G1 X95
    {% else %}
        G1 X82 F12000
        G1 Y310 F12000
        G1 Y324 F600
        G1 X95 F6000
    {% endif %}