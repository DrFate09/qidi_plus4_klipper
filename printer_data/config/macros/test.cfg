[gcode_macro CHECK_EXTRUDE_MODE]
gcode:
    {% set abs_e = printer.gcode_move.absolute_extrude %}
    {% set abs_xyz = printer.gcode_move.absolute_coordinates %}
    RESPOND MSG="Extrude mode: {'ABSOLUTE (M82)' if abs_e else 'RELATIVE (M83)'} | XYZ: {'ABSOLUTE (G90)' if abs_xyz else 'RELATIVE (G91)'}"